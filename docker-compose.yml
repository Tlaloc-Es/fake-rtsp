# A two-camera fleet using the published image.
# Run it with:  docker compose up
#
# Add more cameras by copying a block: bump the host port, point VIDEO_PATH at
# another file in ./videos and give it its own STREAM_NAME.

services:
  camera-parking:
    image: ghcr.io/tlaloc-es/fake-rtsp:latest
    ports:
      - "8554:8554"
    volumes:
      - ./videos:/videos:ro
    environment:
      VIDEO_PATH: /videos/parking.mp4
      STREAM_NAME: parking
    restart: unless-stopped

  camera-entrance:
    image: ghcr.io/tlaloc-es/fake-rtsp:latest
    ports:
      - "8555:8554"
    volumes:
      - ./videos:/videos:ro
    environment:
      VIDEO_PATH: /videos/entrance.mp4
      STREAM_NAME: entrance
    restart: unless-stopped
